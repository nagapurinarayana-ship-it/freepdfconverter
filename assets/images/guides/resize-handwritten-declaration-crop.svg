<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Crop blank paper before resizing</title><desc id="desc">A before and after comparison showing blank paper margins around handwriting and a tighter crop.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Trim blank paper before resizing</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">A tight crop keeps the handwritten content readable inside the required output box.</text><g font-family="Arial,sans-serif"><g transform="translate(100 170)"><rect width="440" height="370" rx="24" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><text x="220" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Original scan or photo</text><rect x="65" y="88" width="310" height="225" fill="#f8f7f3" stroke="#bcc6d5" stroke-width="3"/><rect x="130" y="135" width="180" height="130" fill="#fff" stroke="#9eabbf" stroke-width="3" stroke-dasharray="8 8"/><path d="M148 205c45-83 47 54 90-10 25-37 36 54 67-16" fill="none" stroke="#14213d" stroke-width="7" stroke-linecap="round"/><text x="220" y="347" text-anchor="middle" font-size="16" fill="#66738a">Large margins waste the image area</text></g><path d="M575 355h50" stroke="#8190a8" stroke-width="7"/><path d="m610 335 26 20-26 20" fill="none" stroke="#8190a8" stroke-width="7"/><g transform="translate(660 170)"><rect width="440" height="370" rx="24" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><text x="220" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Tighter prepared crop</text><rect x="95" y="112" width="250" height="165" fill="#fff" stroke="#20874e" stroke-width="5"/><path d="M123 205c45-83 47 54 90-10 25-37 36 54 67-16" fill="none" stroke="#14213d" stroke-width="8" stroke-linecap="round"/><text x="220" y="322" text-anchor="middle" font-size="16" fill="#16743c">More useful area for the handwriting</text></g></g></svg>