<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Handwritten declaration preparation workflow</title><desc id="desc">Five steps show checking requirements, trimming paper, setting dimensions, cleaning the background and reviewing the final file.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Handwritten declaration workflow</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">Prepare the image in the same order that the form evaluates it: rules, crop, dimensions, cleanup, review.</text><g font-family="Arial,sans-serif"><g transform="translate(45 185)"><rect width="205" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="102" cy="62" r="34" fill="#eaf1ff"/><text x="102" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">1</text><text x="102" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">Check rules</text><text x="102" y="171" text-anchor="middle" font-size="15" fill="#66738a">Pixels / KB / format</text><text x="102" y="196" text-anchor="middle" font-size="15" fill="#66738a">from the form</text></g><path d="M258 335h35" stroke="#8190a8" stroke-width="5"/><path d="m286 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(315 185)"><rect width="205" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="102" cy="62" r="34" fill="#eaf1ff"/><text x="102" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">2</text><text x="102" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">Trim paper</text><rect x="47" y="160" width="110" height="90" fill="#f1f3f6" stroke="#c7d0dc"/><rect x="66" y="177" width="72" height="56" fill="#fff"/><path d="M78 210c18-36 18 28 36-2 9-15 8 20 24-6" fill="none" stroke="#14213d" stroke-width="4" stroke-linecap="round"/></g><path d="M528 335h35" stroke="#8190a8" stroke-width="5"/><path d="m556 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(585 185)"><rect width="205" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="102" cy="62" r="34" fill="#eaf1ff"/><text x="102" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">3</text><text x="102" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#14213d">Set size</text><rect x="46" y="166" width="114" height="32" rx="7" fill="#f0f4fa"/><text x="103" y="187" text-anchor="middle" font-size="15" fill="#516079">1200 × 800</text><rect x="46" y="210" width="114" height="32" rx="7" fill="#eaf7ef"/><text x="103" y="231" text-anchor="middle" font-size="15" fill="#16743c">50 KB max</text></g><path d="M798 335h35" stroke="#8190a8" stroke-width="5"/><path d="m826 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(855 185)"><rect width="145" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="72" cy="62" r="34" fill="#eaf1ff"/><text x="72" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">4</text><text x="72" y="132" text-anchor="middle" font-size="19" font-weight="700" fill="#14213d">Clean</text><text x="72" y="165" text-anchor="middle" font-size="15" fill="#66738a">Optional</text><text x="72" y="187" text-anchor="middle" font-size="15" fill="#66738a">background</text><path d="M48 235h49" stroke="#1d7b48" stroke-width="7" stroke-linecap="round"/></g><path d="M1008 335h30" stroke="#8190a8" stroke-width="5"/><path d="m1030 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(1060 185)"><rect width="95" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="48" cy="62" r="34" fill="#eaf1ff"/><text x="48" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">5</text><text x="48" y="136" text-anchor="middle" font-size="18" font-weight="700" fill="#14213d">Review</text><path d="M28 210l13 13 28-34" fill="none" stroke="#20874e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="260" text-anchor="middle" font-size="15" fill="#66738a">Download</text></g></g><rect x="80" y="535" width="1040" height="82" rx="18" fill="#fff" stroke="#d9e1ee" stroke-width="2"/><text x="105" y="572" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">Key rule</text><text x="220" y="572" font-family="Arial,sans-serif" font-size="18" fill="#516079">Use the receiving application's current image rules as the source of truth.</text></svg>