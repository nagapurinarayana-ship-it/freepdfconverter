<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">PDF to Word quality checklist</title><desc id="d">Checklist covering text, tables, page count, scanned PDFs, and final review.</desc><rect width="960" height="540" fill="#f7f9fc"/><text x="64" y="74" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1f2937">Before you trust the DOCX</text><g font-family="Arial,sans-serif" fill="#111827"><rect x="70" y="125" width="820" height="340" rx="24" fill="#fff" stroke="#d7deea" stroke-width="3"/><g font-size="23"><circle cx="125" cy="190" r="17" fill="#1f67ff"/><text x="118" y="198" fill="#fff" font-size="20" font-weight="700">✓</text><text x="165" y="198">Text is selectable in the source PDF</text><circle cx="125" cy="250" r="17" fill="#1f67ff"/><text x="118" y="258" fill="#fff" font-size="20" font-weight="700">✓</text><text x="165" y="258">Page count matches the selected range</text><circle cx="125" cy="310" r="17" fill="#1f67ff"/><text x="118" y="318" fill="#fff" font-size="20" font-weight="700">✓</text><text x="165" y="318">Tables and columns were reviewed manually</text><circle cx="125" cy="370" r="17" fill="#1f67ff"/><text x="118" y="378" fill="#fff" font-size="20" font-weight="700">✓</text><text x="165" y="378">Scanned/image-only pages are not assumed editable</text><circle cx="125" cy="430" r="17" fill="#1f67ff"/><text x="118" y="438" fill="#fff" font-size="20" font-weight="700">✓</text><text x="165" y="438">Open and inspect the downloaded Word file</text></g></g></svg>