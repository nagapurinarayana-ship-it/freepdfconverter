<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Photo compression quality trade-off</title><desc id="desc">Three states show a high-quality large photo, a balanced compressed photo, and an overly aggressive small result.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">The size–quality trade-off</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">A good optimizer searches for the smallest acceptable result, not the smallest file at any cost.</text><g transform="translate(70 175)" font-family="Arial,sans-serif"><rect width="320" height="360" rx="22" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><rect x="45" y="45" width="230" height="160" rx="14" fill="#cfdbea"/><circle cx="175" cy="120" r="52" fill="#b4c4db"/><circle cx="175" cy="120" r="22" fill="#8ca1be"/><text x="160" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Original</text><text x="160" y="279" text-anchor="middle" font-size="18" fill="#516079">2.4 MB</text><text x="160" y="314" text-anchor="middle" font-size="16" fill="#66738a">Maximum detail</text></g><g transform="translate(440 175)" font-family="Arial,sans-serif"><rect width="320" height="360" rx="22" fill="#fff" stroke="#bfe4cd" stroke-width="4"/><rect x="45" y="45" width="230" height="160" rx="14" fill="#d8e6dc"/><circle cx="175" cy="120" r="52" fill="#b9d2c0"/><circle cx="175" cy="120" r="22" fill="#7aa18a"/><text x="160" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#16743c">Balanced result</text><text x="160" y="279" text-anchor="middle" font-size="18" fill="#16743c">80 KB</text><text x="160" y="314" text-anchor="middle" font-size="16" fill="#516079">Good enough for the form</text></g><g transform="translate(810 175)" font-family="Arial,sans-serif"><rect width="320" height="360" rx="22" fill="#fff" stroke="#ecd1d1" stroke-width="4"/><rect x="45" y="45" width="230" height="160" rx="14" fill="#e4d2d2"/><circle cx="175" cy="120" r="52" fill="#c6aaaa"/><circle cx="175" cy="120" r="22" fill="#977777"/><text x="160" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#a63b3b">Too aggressive</text><text x="160" y="279" text-anchor="middle" font-size="18" fill="#a63b3b">18 KB</text><text x="160" y="314" text-anchor="middle" font-size="16" fill="#516079">Detail may be unacceptable</text></g><rect x="80" y="575" width="1040" height="2" fill="#d9e1ee"/><text x="80" y="615" font-family="Arial,sans-serif" font-size="18" fill="#516079">Target compression should stop when the upload requirement is satisfied without unnecessary visual degradation.</text></svg>