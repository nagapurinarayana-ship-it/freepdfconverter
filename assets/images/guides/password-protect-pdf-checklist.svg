<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">PDF protection checklist</title><desc id="desc">Checklist covering password storage, compatibility, permission limits and keeping the original file.</desc>
<rect width="960" height="540" rx="28" fill="#f6f9fd"/><text x="72" y="88" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#152338">Before you share a protected PDF</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="126" width="816" height="72" rx="16" fill="#fff" stroke="#d8e2ef" stroke-width="2"/><circle cx="112" cy="162" r="19" fill="#dff3e7"/><text x="112" y="171" text-anchor="middle" font-size="23" font-weight="700" fill="#167344">✓</text><text x="150" y="171" font-size="22" fill="#23344d">Store the opening password securely.</text>
<rect x="72" y="218" width="816" height="72" rx="16" fill="#fff" stroke="#d8e2ef" stroke-width="2"/><circle cx="112" cy="254" r="19" fill="#dff3e7"/><text x="112" y="263" text-anchor="middle" font-size="23" font-weight="700" fill="#167344">✓</text><text x="150" y="263" font-size="22" fill="#23344d">Keep the original PDF as a separate copy.</text>
<rect x="72" y="310" width="816" height="72" rx="16" fill="#fff" stroke="#d8e2ef" stroke-width="2"/><circle cx="112" cy="346" r="19" fill="#dff3e7"/><text x="112" y="355" text-anchor="middle" font-size="23" font-weight="700" fill="#167344">✓</text><text x="150" y="355" font-size="22" fill="#23344d">Test the protected PDF in the recipient's viewer.</text>
<rect x="72" y="402" width="816" height="82" rx="16" fill="#fff7e6" stroke="#e7c67c" stroke-width="2"/><circle cx="112" cy="443" r="19" fill="#ffe4b5"/><text x="112" y="451" text-anchor="middle" font-size="22" font-weight="700" fill="#8a5a00">!</text><text x="150" y="438" font-size="20" font-weight="700" fill="#5c4209">Permissions are not a substitute for encryption.</text><text x="150" y="465" font-size="18" fill="#6b5730">Use the opening password as the main access control.</text>
</g></svg>