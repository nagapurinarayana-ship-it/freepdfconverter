<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Lossless compression versus image recompression</title>
<desc id="desc">A comparison showing that lossless PDF structure optimization is safest, while image recompression can produce larger reductions but may change image quality.</desc>
<rect width="960" height="540" rx="28" fill="#f6f8fc"/>
<text x="70" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Choose the right kind of PDF compression</text>
<g font-family="Arial,sans-serif">
  <rect x="70" y="135" width="390" height="330" rx="24" fill="#fff" stroke="#d9e0ec" stroke-width="3"/>
  <text x="105" y="190" font-size="26" font-weight="700" fill="#172033">Lossless structure</text>
  <text x="105" y="225" font-size="18" fill="#58657a">The approach used by FreePDF Tools</text>
  <circle cx="120" cy="278" r="18" fill="#dcefe3"/><text x="113" y="286" font-size="20" font-weight="700" fill="#267a46">✓</text>
  <text x="155" y="285" font-size="20" fill="#172033">No intentional image quality loss</text>
  <circle cx="120" cy="325" r="18" fill="#dcefe3"/><text x="113" y="333" font-size="20" font-weight="700" fill="#267a46">✓</text>
  <text x="155" y="332" font-size="20" fill="#172033">Recompress supported streams</text>
  <circle cx="120" cy="372" r="18" fill="#dcefe3"/><text x="113" y="380" font-size="20" font-weight="700" fill="#267a46">✓</text>
  <text x="155" y="379" font-size="20" fill="#172033">Best first step for text/vector PDFs</text>
  <rect x="105" y="410" width="295" height="28" rx="14" fill="#e8eefb"/>

  <rect x="500" y="135" width="390" height="330" rx="24" fill="#fff" stroke="#d9e0ec" stroke-width="3"/>
  <text x="535" y="190" font-size="26" font-weight="700" fill="#172033">Image recompression</text>
  <text x="535" y="225" font-size="18" fill="#58657a">Different trade-off</text>
  <circle cx="550" cy="278" r="18" fill="#f8ead6"/><text x="543" y="286" font-size="20" font-weight="700" fill="#a96813">!</text>
  <text x="585" y="285" font-size="20" fill="#172033">Can reduce image-heavy PDFs more</text>
  <circle cx="550" cy="325" r="18" fill="#f8ead6"/><text x="543" y="333" font-size="20" font-weight="700" fill="#a96813">!</text>
  <text x="585" y="332" font-size="20" fill="#172033">May change image quality</text>
  <circle cx="550" cy="372" r="18" fill="#f8ead6"/><text x="543" y="380" font-size="20" font-weight="700" fill="#a96813">!</text>
  <text x="585" y="379" font-size="20" fill="#172033">Review scans, signatures and diagrams</text>
  <rect x="535" y="410" width="295" height="28" rx="14" fill="#f5e8d5"/>
</g>
</svg>