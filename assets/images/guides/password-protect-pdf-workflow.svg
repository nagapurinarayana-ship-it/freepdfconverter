<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Password protect a PDF locally</title><desc id="desc">Four steps: choose a PDF, create a strong password, set permissions and download the protected file.</desc>
<rect width="960" height="540" rx="28" fill="#f6f9fd"/><rect x="52" y="48" width="856" height="72" rx="18" fill="#1f67ff"/>
<text x="88" y="94" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Protect a PDF locally</text>
<g font-family="Arial,sans-serif" fill="#152338">
<rect x="48" y="150" width="198" height="300" rx="20" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="76" y="198" font-size="22" font-weight="700">1. Choose PDF</text><rect x="76" y="230" width="142" height="88" rx="14" fill="#f7f9fc" stroke="#b8c6da" stroke-dasharray="8 7" stroke-width="2"/><text x="147" y="278" text-anchor="middle" font-size="17" fill="#43546d">Select file</text><text x="147" y="304" text-anchor="middle" font-size="17" fill="#43546d">or drop here</text>
<rect x="268" y="150" width="198" height="300" rx="20" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="296" y="198" font-size="22" font-weight="700">2. Password</text><rect x="296" y="235" width="142" height="46" rx="10" fill="#f7f9fc" stroke="#b8c6da"/><text x="311" y="264" font-size="18" fill="#43546d">••••••••</text><text x="296" y="322" font-size="16" fill="#43546d">Generated owner</text><rect x="296" y="339" width="142" height="42" rx="10" fill="#f7f9fc" stroke="#b8c6da"/>
<rect x="488" y="150" width="198" height="300" rx="20" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="516" y="198" font-size="22" font-weight="700">3. Permissions</text><text x="516" y="248" font-size="18">☑ Print</text><text x="516" y="286" font-size="18">☑ Copy</text><text x="516" y="324" font-size="18">☐ Edit</text><text x="516" y="372" font-size="16" fill="#43546d">Reader-enforced</text><text x="516" y="396" font-size="16" fill="#43546d">restrictions</text>
<rect x="708" y="150" width="204" height="300" rx="20" fill="#fff" stroke="#d8e2ef" stroke-width="3"/><text x="736" y="198" font-size="22" font-weight="700">4. Download</text><rect x="736" y="238" width="146" height="104" rx="8" fill="#fff" stroke="#9caac0" stroke-width="2"/><path d="M770 306 C790 282 806 321 824 294 C840 270 855 308 871 286" fill="none" stroke="#17243a" stroke-width="5" stroke-linecap="round"/><text x="809" y="382" text-anchor="middle" font-size="18" fill="#43546d">Protected PDF</text>
</g></svg>