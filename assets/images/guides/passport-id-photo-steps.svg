<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Passport and ID photo preparation workflow</title><desc id="desc">Five panels show checking the requirements, choosing a source photo, selecting dimensions, adjusting framing and validating the final file.</desc>
<rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
<text x="70" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142033">A reliable ID-photo workflow</text>
<g font-family="Arial,sans-serif">
<g transform="translate(70 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="28" y="120" font-size="24" font-weight="700" fill="#142033">Check</text><text x="28" y="155" font-size="18" fill="#5f6f84">Use the</text><text x="28" y="180" font-size="18" fill="#5f6f84">destination's</text><text x="28" y="205" font-size="18" fill="#5f6f84">current rules.</text></g>
<g transform="translate(300 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="28" y="120" font-size="24" font-weight="700" fill="#142033">Select</text><text x="28" y="155" font-size="18" fill="#5f6f84">Use a clear,</text><text x="28" y="180" font-size="18" fill="#5f6f84">front-facing</text><text x="28" y="205" font-size="18" fill="#5f6f84">source photo.</text></g>
<g transform="translate(530 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="28" y="120" font-size="24" font-weight="700" fill="#142033">Size</text><text x="28" y="155" font-size="18" fill="#5f6f84">Set pixels or</text><text x="28" y="180" font-size="18" fill="#5f6f84">mm/cm, then</text><text x="28" y="205" font-size="18" fill="#5f6f84">verify pixels.</text></g>
<g transform="translate(760 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="28" y="120" font-size="24" font-weight="700" fill="#142033">Frame</text><text x="28" y="155" font-size="18" fill="#5f6f84">Move the crop</text><text x="28" y="180" font-size="18" fill="#5f6f84">to keep the</text><text x="28" y="205" font-size="18" fill="#5f6f84">head in frame.</text></g>
<g transform="translate(990 130)"><rect width="140" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="18" y="120" font-size="22" font-weight="700" fill="#142033">Check</text><text x="18" y="155" font-size="17" fill="#5f6f84">pixels</text><text x="18" y="180" font-size="17" fill="#5f6f84">+ size</text><text x="18" y="205" font-size="17" fill="#5f6f84">+ rules</text></g>
</g></svg>