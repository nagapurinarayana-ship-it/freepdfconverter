<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three ways to make a PDF smaller for email</title><desc id="desc">A simple diagram showing extracting needed pages, removing unnecessary pages, and splitting a large PDF into logical parts.</desc><rect width="1200" height="675" rx="28" fill="#f6f8fb"/><text x="60" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Reduce a PDF for email</text><text x="60" y="122" font-family="Arial,sans-serif" font-size="20" fill="#526071">Start with the change that removes the most unnecessary data.</text><g font-family="Arial,sans-serif"><rect x="60" y="180" width="330" height="390" rx="22" fill="#fff" stroke="#d7deea"/><text x="90" y="230" font-size="24" font-weight="700" fill="#172033">1. Extract</text><text x="90" y="270" font-size="18" fill="#526071">Keep only pages needed</text><g fill="#dfe7f3"><rect x="95" y="315" width="210" height="34" rx="6"/><rect x="95" y="365" width="210" height="34" rx="6"/><rect x="95" y="415" width="210" height="34" rx="6"/></g><path d="M325 332h35M325 382h35M325 432h35" stroke="#1f67ff" stroke-width="8" stroke-linecap="round"/><text x="90" y="520" font-size="17" fill="#526071">Removes whole unused pages.</text><rect x="435" y="180" width="330" height="390" rx="22" fill="#fff" stroke="#d7deea"/><text x="465" y="230" font-size="24" font-weight="700" fill="#172033">2. Clean up</text><text x="465" y="270" font-size="18" fill="#526071">Delete blanks or duplicates</text><g fill="#dfe7f3"><rect x="470" y="315" width="210" height="34" rx="6"/><rect x="470" y="365" width="210" height="34" rx="6"/><rect x="470" y="415" width="210" height="34" rx="6"/></g><circle cx="705" cy="382" r="25" fill="#fff" stroke="#d9534f" stroke-width="6"/><path d="M694 371l22 22M716 371l-22 22" stroke="#d9534f" stroke-width="5"/><text x="465" y="520" font-size="17" fill="#526071">Removes unnecessary content.</text><rect x="810" y="180" width="330" height="390" rx="22" fill="#fff" stroke="#d7deea"/><text x="840" y="230" font-size="24" font-weight="700" fill="#172033">3. Split</text><text x="840" y="270" font-size="18" fill="#526071">Create logical parts</text><rect x="850" y="325" width="95" height="120" rx="10" fill="#dfe7f3"/><rect x="960" y="325" width="95" height="120" rx="10" fill="#dfe7f3"/><path d="M947 385h12" stroke="#1f67ff" stroke-width="8"/><text x="840" y="520" font-size="17" fill="#526071">Makes each attachment smaller.</text></g></svg>
