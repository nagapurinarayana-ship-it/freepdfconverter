<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Signature background options</title><desc id="desc">A comparison of white and transparent signature backgrounds and when each is appropriate.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Choose the background the form supports</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">Transparency can be useful, but a plain white background is safer when the receiving system gives no guidance.</text><g font-family="Arial,sans-serif"><g transform="translate(100 180)"><rect width="450" height="350" rx="24" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><text x="225" y="54" text-anchor="middle" font-size="25" font-weight="700" fill="#14213d">White background</text><rect x="80" y="90" width="290" height="150" rx="12" fill="#fff" stroke="#d9e1ee"/><path d="M115 177c46-92 65 67 111-5 30-47 37 65 105-18" fill="none" stroke="#14213d" stroke-width="7" stroke-linecap="round"/><text x="225" y="286" text-anchor="middle" font-size="17" fill="#16743c">Widely compatible</text><text x="225" y="316" text-anchor="middle" font-size="16" fill="#66738a">Good default when unspecified</text></g><g transform="translate(650 180)"><rect width="450" height="350" rx="24" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><text x="225" y="54" text-anchor="middle" font-size="25" font-weight="700" fill="#14213d">Transparent background</text><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#edf1f5"/><rect x="12" y="12" width="12" height="12" fill="#edf1f5"/></pattern><rect x="80" y="90" width="290" height="150" rx="12" fill="url(#grid)" stroke="#d9e1ee"/><path d="M115 177c46-92 65 67 111-5 30-47 37 65 105-18" fill="none" stroke="#14213d" stroke-width="7" stroke-linecap="round"/><text x="225" y="286" text-anchor="middle" font-size="17" fill="#a36a08">Use only when accepted</text><text x="225" y="316" text-anchor="middle" font-size="16" fill="#66738a">Check the receiving application's format rules</text></g></g><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#516079">Background cleanup should be conservative so light signature strokes are not accidentally removed.</text></svg>