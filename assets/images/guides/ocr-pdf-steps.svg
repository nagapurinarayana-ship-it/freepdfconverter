<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">OCR PDF workflow</title>
<desc id="desc">A scanned PDF page is rendered to an image, recognized by an OCR engine, then exported as editable text and Word.</desc>
<rect width="1200" height="520" rx="32" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="60" y="76" font-size="34" font-weight="700">Scanned PDF → OCR → editable text</text>
<text x="60" y="116" font-size="18" fill="#526079">The browser renders each page, recognizes visible characters and packages the result.</text>
<g transform="translate(70 180)"><rect width="250" height="250" rx="22" fill="#fff" stroke="#d5dbea"/><rect x="74" y="34" width="102" height="146" rx="8" fill="#eef2f8" stroke="#aeb8cf"/><path d="M92 64h68M92 88h68M92 112h55M92 136h60" stroke="#7b879f" stroke-width="8" stroke-linecap="round"/><text x="34" y="214" font-size="24" font-weight="700">1 · Scan</text></g>
<path d="M338 302h110" stroke="#5b6a84" stroke-width="6" stroke-linecap="round"/><path d="m430 280 30 22-30 22" fill="none" stroke="#5b6a84" stroke-width="6"/>
<g transform="translate(475 180)"><rect width="250" height="250" rx="22" fill="#fff" stroke="#d5dbea"/><circle cx="125" cy="105" r="64" fill="#eef2f8" stroke="#aeb8cf" stroke-width="5"/><path d="M92 105c22-44 44 44 66 0 22-44 44 44 66 0" fill="none" stroke="#55647d" stroke-width="8"/><text x="24" y="214" font-size="24" font-weight="700">2 · Recognize</text></g>
<path d="M743 302h110" stroke="#5b6a84" stroke-width="6" stroke-linecap="round"/><path d="m835 280 30 22-30 22" fill="none" stroke="#5b6a84" stroke-width="6"/>
<g transform="translate(880 180)"><rect width="250" height="250" rx="22" fill="#fff" stroke="#d5dbea"/><rect x="44" y="46" width="162" height="104" rx="10" fill="#eef2f8" stroke="#aeb8cf"/><path d="M62 78h118M62 104h96M62 130h122" stroke="#7b879f" stroke-width="7" stroke-linecap="round"/><text x="47" y="190" font-size="24" font-weight="700">3 · Export</text><text x="47" y="224" font-size="16" fill="#526079">DOCX / TXT</text></g>
</g></svg>