<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Thumb impression crop comparison</title><desc id="desc">Three panels compare a loose crop with large blank margins, a tight useful crop and an overly aggressive crop.</desc>
<rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
<text x="70" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142033">Crop the paper, not the impression</text>
<g font-family="Arial,sans-serif">
<g transform="translate(80 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="55" y="75" width="190" height="250" rx="12" fill="#fff" stroke="#9a6500" stroke-width="4"/><ellipse cx="150" cy="205" rx="60" ry="80" fill="#d7dee8"/><text x="150" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Too loose</text><text x="150" y="412" text-anchor="middle" font-size="17" fill="#5f6f84">Large blank margins shrink the ink.</text></g>
<g transform="translate(450 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="76" y="75" width="148" height="250" rx="12" fill="#eef8f6" stroke="#087b58" stroke-width="4"/><ellipse cx="150" cy="202" rx="53" ry="75" fill="#c8d1dd"/><text x="150" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Useful crop</text><text x="150" y="412" text-anchor="middle" font-size="17" fill="#5f6f84">The impression uses the canvas well.</text></g>
<g transform="translate(820 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="95" y="75" width="110" height="250" rx="12" fill="#fff0f0" stroke="#c43232" stroke-width="4"/><ellipse cx="150" cy="190" rx="55" ry="92" fill="#d7dee8"/><text x="150" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Too tight</text><text x="150" y="412" text-anchor="middle" font-size="17" fill="#5f6f84">Important edges may be clipped.</text></g>
</g></svg>