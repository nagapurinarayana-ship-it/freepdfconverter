<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Word to PDF conversion workflow</title><desc id="d">Three steps: choose a Word file, convert it locally, and review the PDF.</desc><rect width="960" height="540" fill="#f7f9fc"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1f2937">Word → PDF in the browser</text><g font-family="Arial,sans-serif"><rect x="60" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="105" cy="185" r="28" fill="#1f67ff"/><text x="96" y="196" font-size="24" font-weight="700" fill="#fff">1</text><text x="90" y="250" font-size="25" font-weight="700" fill="#111827">Choose file</text><text x="90" y="292" font-size="19" fill="#4b5563">DOC, DOCX, DOCM,</text><text x="90" y="320" font-size="19" fill="#4b5563">DOT, DOTX, DOTM + more.</text><path d="M330 280h90" stroke="#9aa7b8" stroke-width="5"/><path d="M407 266l18 14-18 14" fill="none" stroke="#9aa7b8" stroke-width="5"/><rect x="355" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="400" cy="185" r="28" fill="#1f67ff"/><text x="391" y="196" font-size="24" font-weight="700" fill="#fff">2</text><text x="377" y="250" font-size="25" font-weight="700" fill="#111827">Convert locally</text><text x="377" y="292" font-size="19" fill="#4b5563">Browser parser creates</text><text x="377" y="320" font-size="19" fill="#4b5563">a new PDF in memory.</text><path d="M625 280h90" stroke="#9aa7b8" stroke-width="5"/><path d="M702 266l18 14-18 14" fill="none" stroke="#9aa7b8" stroke-width="5"/><rect x="650" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="695" cy="185" r="28" fill="#1f67ff"/><text x="686" y="196" font-size="24" font-weight="700" fill="#fff">3</text><text x="668" y="250" font-size="25" font-weight="700" fill="#111827">Review PDF</text><text x="675" y="292" font-size="19" fill="#4b5563">Check layout, tables,</text><text x="675" y="320" font-size="19" fill="#4b5563">fonts and page breaks.</text></g></svg>