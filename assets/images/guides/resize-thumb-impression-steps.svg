<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Thumb impression preparation workflow</title><desc id="desc">Five steps: check the form requirements, crop margins, set dimensions, clean the background and validate the final file.</desc>
<rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
<text x="70" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142033">Thumb-impression workflow</text>
<g font-family="Arial,sans-serif">
<g transform="translate(70 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="28" y="125" font-size="24" font-weight="700" fill="#142033">Check</text><text x="28" y="160" font-size="18" fill="#5f6f84">Dimensions</text><text x="28" y="185" font-size="18" fill="#5f6f84">Bytes</text><text x="28" y="210" font-size="18" fill="#5f6f84">Format</text></g>
<g transform="translate(300 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="28" y="125" font-size="24" font-weight="700" fill="#142033">Crop</text><text x="28" y="160" font-size="18" fill="#5f6f84">Remove large</text><text x="28" y="185" font-size="18" fill="#5f6f84">blank paper</text><text x="28" y="210" font-size="18" fill="#5f6f84">margins</text></g>
<g transform="translate(530 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="28" y="125" font-size="24" font-weight="700" fill="#142033">Size</text><text x="28" y="160" font-size="18" fill="#5f6f84">Set the</text><text x="28" y="185" font-size="18" fill="#5f6f84">required</text><text x="28" y="210" font-size="18" fill="#5f6f84">canvas</text></g>
<g transform="translate(760 130)"><rect width="200" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="28" y="125" font-size="24" font-weight="700" fill="#142033">Clean</text><text x="28" y="160" font-size="18" fill="#5f6f84">Background</text><text x="28" y="185" font-size="18" fill="#5f6f84">only as much</text><text x="28" y="210" font-size="18" fill="#5f6f84">as needed</text></g>
<g transform="translate(990 130)"><rect width="140" height="430" rx="22" fill="#fff" stroke="#dce4ef"/><circle cx="48" cy="52" r="26" fill="#1f67ff"/><text x="48" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="18" y="125" font-size="22" font-weight="700" fill="#142033">Check</text><text x="18" y="160" font-size="17" fill="#5f6f84">Pixels</text><text x="18" y="185" font-size="17" fill="#5f6f84">Bytes</text><text x="18" y="210" font-size="17" fill="#5f6f84">Ink</text></g>
</g></svg>