<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Photo compression workflow</title><desc id="desc">A four-step workflow from selecting a photo to setting dimensions, choosing a target size, and downloading the optimized image.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">A practical photo-size workflow</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">Dimensions first → target size second → inspect the result before uploading.</text><g font-family="Arial,sans-serif"><g transform="translate(70 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="65" r="34" fill="#eaf1ff"/><text x="120" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">1</text><text x="120" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Choose photo</text><rect x="55" y="165" width="130" height="78" rx="10" fill="#e8eef7"/><circle cx="120" cy="201" r="24" fill="#c6d5ea"/><text x="120" y="275" text-anchor="middle" font-size="16" fill="#66738a">JPG · PNG · WebP</text></g><path d="M330 335h55" stroke="#8190a8" stroke-width="5" stroke-linecap="round"/><path d="m375 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(400 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="65" r="34" fill="#eaf1ff"/><text x="120" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">2</text><text x="120" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Set dimensions</text><rect x="48" y="166" width="144" height="42" rx="9" fill="#f0f4fa"/><text x="120" y="194" text-anchor="middle" font-size="17" fill="#516079">1600 × 1200 px</text><rect x="48" y="218" width="144" height="42" rx="9" fill="#f0f4fa"/><text x="120" y="246" text-anchor="middle" font-size="17" fill="#516079">mm · cm · DPI</text></g><path d="M660 335h55" stroke="#8190a8" stroke-width="5" stroke-linecap="round"/><path d="m705 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(730 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="65" r="34" fill="#eaf1ff"/><text x="120" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">3</text><text x="120" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Set target</text><rect x="55" y="168" width="130" height="42" rx="9" fill="#eaf7ef"/><text x="120" y="196" text-anchor="middle" font-size="18" fill="#16743c">50 KB max</text><text x="120" y="240" text-anchor="middle" font-size="16" fill="#66738a">Try quality + size</text><text x="120" y="265" text-anchor="middle" font-size="16" fill="#66738a">without extremes</text></g><path d="M990 335h55" stroke="#8190a8" stroke-width="5" stroke-linecap="round"/><path d="m1035 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(1060 185)"><rect width="100" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="50" cy="65" r="34" fill="#eaf1ff"/><text x="50" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">4</text><text x="50" y="141" text-anchor="middle" font-size="19" font-weight="700" fill="#14213d">Check</text><path d="M30 205l16 16 27-32" fill="none" stroke="#20874e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="260" text-anchor="middle" font-size="15" fill="#66738a">Download</text></g></g><rect x="80" y="535" width="1040" height="82" rx="18" fill="#fff" stroke="#d9e1ee" stroke-width="2"/><text x="105" y="572" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">Key rule</text><text x="215" y="572" font-family="Arial,sans-serif" font-size="18" fill="#516079">A file-size target is a maximum goal, not a promise of an exact byte count.</text></svg>