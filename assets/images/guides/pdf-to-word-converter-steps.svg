<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">PDF to Word browser workflow</title><desc id="d">Three steps: choose a text PDF, extract selectable text locally, and download an editable DOCX.</desc><rect width="960" height="540" fill="#f7f9fc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1f2937">PDF → Word in the browser</text><g font-family="Arial,sans-serif"><rect x="60" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="105" cy="185" r="28" fill="#1f67ff"/><text x="96" y="196" font-size="24" font-weight="700" fill="#fff">1</text><text x="92" y="250" font-size="25" font-weight="700" fill="#111827">Choose PDF</text><text x="92" y="292" font-size="19" fill="#4b5563">Best with a</text><text x="92" y="320" font-size="19" fill="#4b5563">selectable text layer.</text><rect x="92" y="350" width="170" height="42" rx="10" fill="#eef3ff"/><text x="112" y="377" font-size="18" fill="#1f67ff">Local file</text><path d="M330 280h90" stroke="#9aa7b8" stroke-width="5"/><path d="M407 266l18 14-18 14" fill="none" stroke="#9aa7b8" stroke-width="5"/><rect x="355" y="262" width="35" height="36" rx="8" fill="#fff"/><rect x="355" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="400" cy="185" r="28" fill="#1f67ff"/><text x="391" y="196" font-size="24" font-weight="700" fill="#fff">2</text><text x="384" y="250" font-size="25" font-weight="700" fill="#111827">Extract text</text><text x="384" y="292" font-size="19" fill="#4b5563">PDF.js reads the</text><text x="384" y="320" font-size="19" fill="#4b5563">document in memory.</text><rect x="384" y="350" width="180" height="42" rx="10" fill="#eef3ff"/><text x="405" y="377" font-size="18" fill="#1f67ff">No upload</text><path d="M625 280h90" stroke="#9aa7b8" stroke-width="5"/><path d="M702 266l18 14-18 14" fill="none" stroke="#9aa7b8" stroke-width="5"/><rect x="650" y="140" rx="22" width="250" height="280" fill="#fff" stroke="#d7deea" stroke-width="3"/><circle cx="695" cy="185" r="28" fill="#1f67ff"/><text x="686" y="196" font-size="24" font-weight="700" fill="#fff">3</text><text x="676" y="250" font-size="25" font-weight="700" fill="#111827">Download DOCX</text><text x="676" y="292" font-size="19" fill="#4b5563">Editable Word output</text><text x="676" y="320" font-size="19" fill="#4b5563">with page boundaries.</text><rect x="676" y="350" width="170" height="42" rx="10" fill="#eef3ff"/><text x="697" y="377" font-size="18" fill="#1f67ff">.docx file</text></g></svg>