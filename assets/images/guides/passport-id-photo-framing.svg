<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Passport photo framing comparison</title><desc id="desc">Three portrait framing examples compare too little headroom, balanced framing and excessive empty space above the head.</desc>
<rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
<text x="70" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142033">Check the crop before you download</text>
<g font-family="Arial,sans-serif">
<g transform="translate(80 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="76" y="75" width="148" height="260" rx="12" fill="#eef4ff" stroke="#1f67ff" stroke-width="4"/><circle cx="150" cy="172" r="42" fill="#d6dde8"/><path d="M105 315 Q150 235 195 315" fill="#c8d1dd"/><text x="150" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Too high</text><text x="150" y="420" text-anchor="middle" font-size="17" fill="#5f6f84">Hair or head may be cut.</text></g>
<g transform="translate(450 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="76" y="75" width="148" height="260" rx="12" fill="#eef8f6" stroke="#087b58" stroke-width="4"/><circle cx="150" cy="166" r="42" fill="#d6dde8"/><path d="M105 315 Q150 235 195 315" fill="#c8d1dd"/><text x="150" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Balanced</text><text x="150" y="420" text-anchor="middle" font-size="17" fill="#5f6f84">Head and shoulders stay clear.</text></g>
<g transform="translate(820 130)"><rect width="300" height="450" rx="20" fill="#fff" stroke="#dce4ef"/><rect x="76" y="75" width="148" height="260" rx="12" fill="#fffaf0" stroke="#9a6500" stroke-width="4"/><circle cx="150" cy="205" r="42" fill="#d6dde8"/><path d="M105 315 Q150 270 195 315" fill="#c8d1dd"/><text x="150" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#142033">Too low</text><text x="150" y="420" text-anchor="middle" font-size="17" fill="#5f6f84">Too much empty space above.</text></g>
</g></svg>