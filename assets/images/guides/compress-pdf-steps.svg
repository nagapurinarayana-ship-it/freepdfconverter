<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Three-step lossless PDF compression workflow</title>
<desc id="desc">Choose a PDF, compress its streams and objects locally, then compare the output size and download the smaller copy.</desc>
<rect width="960" height="540" rx="28" fill="#f6f8fc"/>
<text x="70" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Compress a PDF in three steps</text>
<g font-family="Arial,sans-serif">
  <rect x="70" y="145" width="245" height="285" rx="24" fill="#fff" stroke="#d9e0ec" stroke-width="3"/>
  <circle cx="120" cy="195" r="28" fill="#eef3ff"/><text x="111" y="206" font-size="28" font-weight="700" fill="#2858d6">1</text>
  <text x="105" y="260" font-size="24" font-weight="700" fill="#172033">Choose PDF</text>
  <rect x="105" y="290" width="175" height="92" rx="14" fill="#f1f4fa"/>
  <text x="150" y="330" font-size="34" font-weight="700" fill="#2858d6">PDF</text>
  <text x="115" y="405" font-size="18" fill="#58657a">File stays in browser</text>

  <rect x="357" y="145" width="245" height="285" rx="24" fill="#fff" stroke="#d9e0ec" stroke-width="3"/>
  <circle cx="407" cy="195" r="28" fill="#eef3ff"/><text x="398" y="206" font-size="28" font-weight="700" fill="#2858d6">2</text>
  <text x="392" y="260" font-size="24" font-weight="700" fill="#172033">Compress</text>
  <path d="M410 320h140M440 295v50M475 285v70M510 300v40" stroke="#2858d6" stroke-width="12" stroke-linecap="round"/>
  <text x="392" y="405" font-size="18" fill="#58657a">Lossless structure pass</text>

  <rect x="645" y="145" width="245" height="285" rx="24" fill="#fff" stroke="#d9e0ec" stroke-width="3"/>
  <circle cx="695" cy="195" r="28" fill="#eef3ff"/><text x="686" y="206" font-size="28" font-weight="700" fill="#2858d6">3</text>
  <text x="680" y="260" font-size="24" font-weight="700" fill="#172033">Check size</text>
  <rect x="680" y="295" width="175" height="78" rx="12" fill="#f1f4fa"/>
  <text x="700" y="328" font-size="18" fill="#58657a">Original</text><text x="700" y="355" font-size="22" font-weight="700" fill="#172033">12.4 MB</text>
  <text x="798" y="328" font-size="18" fill="#58657a">New</text><text x="798" y="355" font-size="22" font-weight="700" fill="#2858d6">8.1 MB</text>
  <text x="682" y="405" font-size="18" fill="#58657a">Download smaller copy</text>

  <path d="M315 285h35M602 285h35" stroke="#9aa7ba" stroke-width="5" stroke-linecap="round"/>
  <path d="M340 278l12 7-12 7M627 278l12 7-12 7" fill="#9aa7ba"/>
</g>
</svg>