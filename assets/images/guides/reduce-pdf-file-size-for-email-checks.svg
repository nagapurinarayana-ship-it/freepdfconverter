<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Checklist before emailing a smaller PDF</title><desc id="desc">A checklist showing page count, important features, file size, filename, and keeping the original PDF.</desc><rect width="1200" height="675" rx="28" fill="#f6f8fb"/><text x="60" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Before you email the smaller PDF</text><text x="60" y="122" font-family="Arial,sans-serif" font-size="20" fill="#526071">Verify the result before replacing or deleting the original.</text><g font-family="Arial,sans-serif"><rect x="70" y="175" width="1060" height="410" rx="24" fill="#fff" stroke="#d7deea"/><g font-size="23" fill="#172033"><circle cx="125" cy="245" r="22" fill="#1f67ff"/><path d="M114 245l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="253">Check the first, middle and final relevant pages.</text><circle cx="125" cy="320" r="22" fill="#1f67ff"/><path d="M114 320l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="328">Confirm forms, links, signatures and stamps still work.</text><circle cx="125" cy="395" r="22" fill="#1f67ff"/><path d="M114 395l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="403">Check the final file size against the recipient limit.</text><circle cx="125" cy="470" r="22" fill="#1f67ff"/><path d="M114 470l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="478">Use a clear filename and keep the original as a backup.</text></g><rect x="850" y="215" width="220" height="260" rx="16" fill="#eef2f7" stroke="#cfd8e6"/><path d="M900 270h120M900 315h120M900 360h80" stroke="#9aa8ba" stroke-width="12" stroke-linecap="round"/><text x="850" y="535" font-size="18" fill="#526071">Review before sending</text></g></svg>
