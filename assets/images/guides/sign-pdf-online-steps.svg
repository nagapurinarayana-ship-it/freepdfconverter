<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Three-step PDF signing workflow</title>
<desc id="desc">Choose a PDF, create a signature, and place the signature on the document locally in the browser.</desc>
<rect width="960" height="540" rx="28" fill="#f6f9fd"/>
<rect x="48" y="48" width="864" height="74" rx="18" fill="#1f67ff"/>
<text x="84" y="95" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Sign a PDF locally in three steps</text>
<g font-family="Arial,sans-serif">
  <rect x="60" y="164" width="250" height="290" rx="22" fill="#fff" stroke="#d8e2ef" stroke-width="3"/>
  <circle cx="112" cy="216" r="28" fill="#e9f0ff"/><text x="112" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1f67ff">1</text>
  <text x="96" y="274" font-size="25" font-weight="700" fill="#152338">Choose PDF</text>
  <rect x="96" y="300" width="178" height="86" rx="14" fill="#f7f9fc" stroke="#b8c6da" stroke-dasharray="8 7" stroke-width="2"/>
  <text x="185" y="337" text-anchor="middle" font-size="18" fill="#43546d">Select or drop</text>
  <text x="185" y="364" text-anchor="middle" font-size="18" fill="#43546d">your PDF</text>
  <rect x="355" y="164" width="250" height="290" rx="22" fill="#fff" stroke="#d8e2ef" stroke-width="3"/>
  <circle cx="407" cy="216" r="28" fill="#e9f0ff"/><text x="407" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1f67ff">2</text>
  <text x="391" y="274" font-size="25" font-weight="700" fill="#152338">Create signature</text>
  <path d="M400 356 C430 318 455 378 484 334 C508 298 532 370 560 330" fill="none" stroke="#17243a" stroke-width="7" stroke-linecap="round"/>
  <text x="480" y="414" text-anchor="middle" font-size="18" fill="#43546d">Draw or type</text>
  <rect x="650" y="164" width="250" height="290" rx="22" fill="#fff" stroke="#d8e2ef" stroke-width="3"/>
  <circle cx="702" cy="216" r="28" fill="#e9f0ff"/><text x="702" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1f67ff">3</text>
  <text x="686" y="274" font-size="25" font-weight="700" fill="#152338">Place &amp; download</text>
  <rect x="688" y="301" width="174" height="95" rx="8" fill="#fff" stroke="#9caac0" stroke-width="2"/>
  <path d="M723 368 C742 347 758 382 777 353 C794 329 811 369 827 347" fill="none" stroke="#17243a" stroke-width="5" stroke-linecap="round"/>
  <text x="775" y="425" text-anchor="middle" font-size="18" fill="#43546d">New signed PDF</text>
</g>
</svg>