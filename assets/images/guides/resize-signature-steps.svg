<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Signature preparation workflow</title><desc id="desc">Four steps show cropping whitespace, choosing background, setting dimensions and compressing the signature.</desc><rect width="1200" height="675" rx="32" fill="#f7f9fc"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Signature preparation workflow</text><text x="80" y="122" font-family="Arial,sans-serif" font-size="19" fill="#516079">Crop the actual ink first, then match the receiving form's dimensions and file-size limit.</text><g font-family="Arial,sans-serif"><g transform="translate(70 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="62" r="34" fill="#eaf1ff"/><text x="120" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">1</text><text x="120" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Trim margins</text><rect x="46" y="163" width="148" height="74" rx="8" fill="#f1f3f6" stroke="#c7d0dc" stroke-width="2"/><path d="M67 204c22-45 32 35 51-2 13-25 17 34 50-8" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round"/></g><path d="M330 335h55" stroke="#8190a8" stroke-width="5"/><path d="m375 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(400 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="62" r="34" fill="#eaf1ff"/><text x="120" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">2</text><text x="120" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Clean background</text><rect x="46" y="163" width="148" height="74" rx="8" fill="#fff" stroke="#c7d0dc"/><path d="M67 204c22-45 32 35 51-2 13-25 17 34 50-8" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round"/></g><path d="M660 335h55" stroke="#8190a8" stroke-width="5"/><path d="m705 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(730 185)"><rect width="240" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="120" cy="62" r="34" fill="#eaf1ff"/><text x="120" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">3</text><text x="120" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Set size</text><rect x="62" y="163" width="116" height="35" rx="7" fill="#f0f4fa"/><text x="120" y="187" text-anchor="middle" font-size="16" fill="#516079">600 × 200 px</text><rect x="62" y="211" width="116" height="35" rx="7" fill="#eaf7ef"/><text x="120" y="235" text-anchor="middle" font-size="16" fill="#16743c">50 KB max</text></g><path d="M990 335h55" stroke="#8190a8" stroke-width="5"/><path d="m1035 320 18 15-18 15" fill="none" stroke="#8190a8" stroke-width="5"/><g transform="translate(1060 185)"><rect width="100" height="300" rx="20" fill="#fff" stroke="#d9e1ee" stroke-width="3"/><circle cx="50" cy="62" r="34" fill="#eaf1ff"/><text x="50" y="73" text-anchor="middle" font-size="30" font-weight="700" fill="#2867d8">4</text><text x="50" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#14213d">Review</text><path d="M28 205l16 16 28-34" fill="none" stroke="#20874e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="259" text-anchor="middle" font-size="15" fill="#66738a">Download</text></g></g><rect x="80" y="535" width="1040" height="82" rx="18" fill="#fff" stroke="#d9e1ee" stroke-width="2"/><text x="105" y="572" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">Key rule</text><text x="215" y="572" font-family="Arial,sans-serif" font-size="18" fill="#516079">Always follow the exact dimensions and format rules of the receiving form.</text></svg>