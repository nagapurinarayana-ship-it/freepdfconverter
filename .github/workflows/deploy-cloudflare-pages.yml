name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: freepdf-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build production site
        env:
          SITE_ORIGIN: https://freepdfconverter-all-in-one.pages.dev
          CF_PAGES_BRANCH: main
        run: npm run build

      - name: Verify production build
        run: node scripts/check-build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name freepdfconverter-all-in-one --branch main --commit-hash "${GITHUB_SHA}" --commit-message "FreePDF Tools ${GITHUB_SHA}"

      - name: Verify live document converters
        env:
          SITE_ORIGIN: https://freepdfconverter-all-in-one.pages.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/tools/word-to-pdf?deploy-check=${GITHUB_SHA}" -o /tmp/word-to-pdf.html
          grep -q "Microsoft Word 97–2003" /tmp/word-to-pdf.html
          grep -q "DOCX" /tmp/word-to-pdf.html

          WORD_JS_PATH="$(grep -oE 'assets/js/word-to-pdf\.[a-f0-9]{10}\.js' /tmp/word-to-pdf.html | head -1)"
          test -n "$WORD_JS_PATH"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/$WORD_JS_PATH?deploy-check=${GITHUB_SHA}" -o /tmp/word-to-pdf.js
          grep -q "getMsDocParser" /tmp/word-to-pdf.js
          grep -q "\\.doc" /tmp/word-to-pdf.js
          grep -q "\\.docx" /tmp/word-to-pdf.js

          DOCJS_PATH="$(grep -oE 'assets/vendor/docjs/index\.[a-f0-9]{10}\.js' /tmp/word-to-pdf.js | head -1)"
          test -n "$DOCJS_PATH"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/$DOCJS_PATH?deploy-check=${GITHUB_SHA}" -o /tmp/docjs.js
          grep -q "parseMsDoc" /tmp/docjs.js

          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/tools/pdf-to-word?deploy-check=${GITHUB_SHA}" -o /tmp/pdf-to-word.html
          grep -q "DOCX" /tmp/pdf-to-word.html
          PDF_WORD_JS_PATH="$(grep -oE 'assets/js/pdf-to-word\.[a-f0-9]{10}\.js' /tmp/pdf-to-word.html | head -1)"
          test -n "$PDF_WORD_JS_PATH"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/$PDF_WORD_JS_PATH?deploy-check=${GITHUB_SHA}" -o /tmp/pdf-to-word.js
          grep -q "buildDocx" /tmp/pdf-to-word.js
          grep -q "\\.docx" /tmp/pdf-to-word.js

          echo "Production document converters are serving both legacy DOC and modern DOCX workflows."
