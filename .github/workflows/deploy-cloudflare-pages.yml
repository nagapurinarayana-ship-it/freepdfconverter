name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freepdf-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build production site
        env:
          SITE_ORIGIN: https://freepdfconverter-all-in-one.pages.dev
          CF_PAGES_BRANCH: main
        run: npm run build

      - name: Verify production build
        run: node scripts/check-build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name freepdfconverter-all-in-one --branch main --commit-dirty=true

      - name: Verify live Word converter
        env:
          SITE_ORIGIN: https://freepdfconverter-all-in-one.pages.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/tools/word-to-pdf?deploy-check=${GITHUB_SHA}" -o /tmp/word-to-pdf.html
          grep -q "Microsoft Word 97–2003" /tmp/word-to-pdf.html
          grep -q 'assets/js/word-to-pdf.js' /tmp/word-to-pdf.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_ORIGIN/assets/js/word-to-pdf.js?deploy-check=${GITHUB_SHA}" -o /tmp/word-to-pdf.js
          grep -q "parseMsDoc" /tmp/word-to-pdf.js
          echo "Production Word 97-2003 converter is serving the deployed implementation."
