name: New Image Tools Final

on:
  pull_request:
    branches: [main]
  push:
    branches: [image-tools-final-v3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --progress=false
      - run: npm run verify