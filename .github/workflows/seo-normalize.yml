name: SEO Normalize

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize HTML SEO metadata
        run: node scripts/normalize-seo.mjs

      - name: Commit SEO fixes
        run: |
          if git diff --quiet; then
            echo "No SEO metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Normalize SEO metadata"
          git push
