name: SEO Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freepdf-seo-main
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize canonical, social and structured metadata
        run: node scripts/normalize-seo.mjs

      - name: Audit every sitemap page
        run: node scripts/seo-audit.mjs

      - name: Publish normalized HTML to main
        run: |
          if git diff --quiet; then
            echo "All tracked HTML already satisfies the SEO normalizer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Normalize FreePDF production SEO URLs and metadata"
          git push origin HEAD:main
