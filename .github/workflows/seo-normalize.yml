name: Production Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freepdf-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install document parser dependency
        run: npm install --ignore-scripts

      - name: Validate document converters and parser
        run: npm run test:docs

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build production site
        env:
          SITE_ORIGIN: https://freepdfconverter-all-in-one.pages.dev
          CF_PAGES_BRANCH: main
        run: npm run build

      - name: Verify production build
        run: node scripts/check-build.mjs

      - name: Audit checked-in sitemap pages
        run: node scripts/seo-audit.mjs

      - name: Verify SEO normalization is idempotent
        run: |
          node scripts/normalize-seo.mjs
          git diff --exit-code
