name: SEO Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freepdf-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit checked-in sitemap pages
        run: node scripts/seo-audit.mjs

      - name: Verify SEO normalization is idempotent
        run: |
          node scripts/normalize-seo.mjs
          git diff --exit-code
